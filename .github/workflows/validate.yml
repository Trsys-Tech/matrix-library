name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - run: npm run build
